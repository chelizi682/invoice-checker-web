<!DOCTYPE html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轻量级团队报销预检助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #f5f6f8;
      background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(18, 47, 107, 0.08), transparent);
    }

    textarea::-webkit-scrollbar {
      width: 8px;
    }

    textarea::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }

    textarea::-webkit-scrollbar-track {
      background: transparent;
    }
  </style>
</head>
<body class="min-h-screen text-slate-900 antialiased">
  <div class="mx-auto w-full max-w-3xl px-5 py-12 sm:px-6 sm:py-16">
    <header class="mb-9">
      <div class="flex items-center gap-2.5">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-[#122f6b] text-white shadow-sm">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 2h12v20l-3-2-3 2-3-2-3 2V2Z"></path>
            <path d="M9 7h6M9 11h6M9 15h3"></path>
          </svg>
        </span>
        <span class="text-[11px] font-semibold uppercase tracking-[0.18em] text-slate-500">Expense Pre-check</span>
      </div>

      <h1 class="mt-5 text-3xl font-semibold tracking-tight text-slate-950 sm:text-4xl">轻量级团队报销预检助手</h1>
      <p class="mt-3 text-sm leading-7 text-slate-500 sm:text-base">基于内部管理规范的 AI 发票合规筛查</p>
    </header>

    <main>
      <section class="rounded-2xl border border-slate-200/80 bg-white p-5 shadow-[0_1px_2px_rgba(15,23,42,0.04),0_16px_40px_-24px_rgba(15,23,42,0.18)] sm:p-7">
        <div class="mb-3 flex items-center justify-between gap-3">
          <label for="invoiceText" class="text-sm font-medium text-slate-700">发票文本</label>
          <span class="text-xs text-slate-400">支持多张 · 自动拆单</span>
        </div>

        <textarea id="invoiceText" rows="9" spellcheck="false" class="min-h-[220px] w-full resize-y rounded-xl border border-slate-200 bg-slate-50/70 px-4 py-3.5 text-sm leading-6 text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#122f6b] focus:bg-white focus:ring-4 focus:ring-[#122f6b]/5" placeholder="请粘贴全电发票文本，支持多张连续粘贴..."></textarea>

        <div class="mt-4 flex flex-col-reverse gap-3 sm:flex-row sm:items-center sm:justify-between">
          <p class="text-xs leading-5 text-slate-400">内容仅用于本次合规预检，不会在本地留存。</p>
          <button id="submitButton" type="button" class="inline-flex h-11 shrink-0 items-center justify-center gap-2 rounded-xl bg-[#122f6b] px-6 text-sm font-medium text-white shadow-sm transition hover:bg-[#0d2455] focus:outline-none focus:ring-4 focus:ring-[#122f6b]/20 disabled:cursor-not-allowed disabled:opacity-60">
            <svg id="buttonSpinner" class="hidden h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 0 1 8-8v4a4 4 0 0 0-4 4H4Z"></path>
            </svg>
            <svg id="buttonIcon" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6"></path>
            </svg>
            <span id="buttonLabel">开始合规预检</span>
          </button>
        </div>
      </section>

      <section id="resultsSection" class="mt-9 hidden scroll-mt-8" aria-live="polite">
        <div class="mb-4 flex items-center justify-between gap-3">
          <h2 class="text-base font-semibold tracking-tight text-slate-900">审查结果</h2>
          <span id="resultCount" class="text-xs text-slate-400"></span>
        </div>

        <div id="loadingState" class="hidden rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
          <div class="flex items-center gap-3">
            <div class="h-5 w-5 shrink-0 animate-spin rounded-full border-2 border-slate-200 border-t-[#122f6b]"></div>
            <div>
              <p class="text-sm font-medium text-slate-800">AI 正在审核中...</p>
              <p class="mt-0.5 text-xs text-slate-400">正在提取票面字段并匹配内部合规规则</p>
            </div>
          </div>
          <div class="mt-6 space-y-3" aria-hidden="true">
            <div class="h-2.5 w-3/5 animate-pulse rounded-full bg-slate-100"></div>
            <div class="h-2.5 w-4/5 animate-pulse rounded-full bg-slate-100"></div>
            <div class="h-2.5 w-2/5 animate-pulse rounded-full bg-slate-100"></div>
          </div>
        </div>

        <div id="errorState" class="hidden rounded-2xl border border-red-200 bg-red-50 p-5">
          <div class="flex gap-3">
            <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-red-100 text-red-600">
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M12 8v5M12 17h.01"></path>
                <circle cx="12" cy="12" r="9"></circle>
              </svg>
            </span>
            <div class="min-w-0">
              <p class="text-sm font-semibold text-red-800">预检请求未完成</p>
              <p id="errorMessage" class="mt-1 break-words text-sm leading-6 text-red-700"></p>
              <p class="mt-2 text-xs leading-5 text-red-500/80">请确认代理服务与网络连接正常，或稍后重试。</p>
            </div>
          </div>
        </div>

        <div id="resultsList" class="space-y-4"></div>
      </section>
    </main>

    <footer class="mt-10 border-t border-slate-200/80 pt-5">
      <p class="text-center text-xs text-slate-400">内部预检工具 · 审查结果仅供报销前参考</p>
    </footer>
  </div>

  <script>
    const API_ENDPOINT =
      'https://corsproxy.io/?' +
      encodeURIComponent('https://api.coze.cn/v1/workflow/run');
    const DIRECT_API_ENDPOINT = 'https://api.coze.cn/v1/workflow/run';

    const WORKFLOW_ID = '7711281464972820515';
    const ACCESS_TOKEN = 'sat_2Ya8ATPAvTAtHQvCwkOpRjSmDVnoNNdP2x802UHo6FLduFDHSFlfUlzFNKToAlRR';

    const invoiceText = document.getElementById('invoiceText');
    const submitButton = document.getElementById('submitButton');
    const buttonLabel = document.getElementById('buttonLabel');
    const buttonSpinner = document.getElementById('buttonSpinner');
    const buttonIcon = document.getElementById('buttonIcon');
    const resultsSection = document.getElementById('resultsSection');
    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');
    const errorMessage = document.getElementById('errorMessage');
    const resultsList = document.getElementById('resultsList');
    const resultCount = document.getElementById('resultCount');

    const RISK_THEMES = {
      RED: {
        icon: '🚨',
        name: 'RED',
        card: 'border-red-200/80 border-l-red-500 bg-red-50',
        eyebrow: 'text-red-500/80',
        badge: 'bg-red-100 text-red-700 ring-red-200',
        title: 'text-red-950',
        label: 'text-red-500/80',
        value: 'text-red-900',
        divider: 'border-red-200/80',
        warning: 'text-red-800',
        suggestion: 'bg-red-100/50 text-red-950 ring-red-200/60',
      },
      YELLOW: {
        icon: '🟡',
        name: 'YELLOW',
        card: 'border-yellow-200/80 border-l-yellow-400 bg-yellow-50',
        eyebrow: 'text-yellow-600/80',
        badge: 'bg-yellow-100 text-yellow-800 ring-yellow-200',
        title: 'text-yellow-950',
        label: 'text-yellow-600/80',
        value: 'text-yellow-900',
        divider: 'border-yellow-200/80',
        warning: 'text-yellow-800',
        suggestion: 'bg-yellow-100/50 text-yellow-950 ring-yellow-200/60',
      },
      GREEN: {
        icon: '🟢',
        name: 'GREEN',
        card: 'border-green-200/80 border-l-green-500 bg-green-50',
        eyebrow: 'text-green-600/80',
        badge: 'bg-green-100 text-green-700 ring-green-200',
        title: 'text-green-950',
        label: 'text-green-600/80',
        value: 'text-green-900',
        divider: 'border-green-200/80',
        warning: 'text-green-800',
        suggestion: 'bg-green-100/50 text-green-950 ring-green-200/60',
      },
      ERROR: {
        icon: '⚠️',
        name: 'ERROR',
        card: 'border-slate-200 border-l-slate-400 bg-slate-50',
        eyebrow: 'text-slate-400',
        badge: 'bg-slate-200 text-slate-600 ring-slate-300',
        title: 'text-slate-700',
        label: 'text-slate-400',
        value: 'text-slate-600',
        divider: 'border-slate-200',
        warning: 'text-slate-600',
        suggestion: 'bg-slate-100 text-slate-700 ring-slate-200',
      },
    };

    const FIELD_KEYS = {
      title: ['抬头', 'buyer_name', 'purchaser_name', 'invoice_title', 'title', 'header', 'invoice_header'],
      number: ['号码', 'invoice_number', 'number', 'raw_invoice_number', 'invoice_no', 'invoice_code', 'no'],
      details: ['明细', 'item_name', 'items', 'details', 'invoice_details', 'content', 'goods', 'line_items'],
      amount: ['金额', 'amount', 'total_amount', 'total', 'invoice_amount', 'price'],
    };

    function pickField(invoice, keys) {
      const sources = [invoice?.extracted_fields, invoice?.fields, invoice].filter(
        (source) => source && typeof source === 'object'
      );

      for (const key of keys) {
        for (const source of sources) {
          const value = source[key];
          if (value !== undefined && value !== null && value !== '') {
            return value;
          }
        }
      }
      return '—';
    }

    function toDisplayText(value) {
      if (value === undefined || value === null || value === '') return '—';
      if (Array.isArray(value)) {
        if (value.length === 0) return '—';
        return value
          .map((item) => {
            if (item === null || item === undefined) return '';
            if (typeof item === 'string' || typeof item === 'number') return String(item);
            if (typeof item === 'object') {
              const parts = [
                item.name,
                item.item,
                item.description,
                item.product,
                item.spec,
                item.amount,
                item.price,
              ].filter((part) => part !== undefined && part !== null && part !== '');
              return parts.length ? parts.join(' · ') : JSON.stringify(item);
            }
            return String(item);
          })
          .filter(Boolean)
          .join('\n');
      }
      if (typeof value === 'object') return JSON.stringify(value);
      return String(value);
    }

    function normalizeWarnings(value) {
      if (Array.isArray(value)) {
        return value.map(toDisplayText).filter(Boolean);
      }
      if (typeof value === 'string' && value.trim()) {
        return [value.trim()];
      }
      return [];
    }

    function normalizeRiskLevel(value) {
      const level = String(value || '').trim().toUpperCase();
      return RISK_THEMES[level] ? level : 'ERROR';
    }

    function createField(label, value, extraClass = '') {
      const wrapper = document.createElement('div');
      wrapper.className = extraClass;

      const term = document.createElement('dt');
      term.className = 'text-[11px] font-medium uppercase tracking-wider';
      term.textContent = label;

      const description = document.createElement('dd');
      description.className = 'mt-1 whitespace-pre-wrap break-words text-sm leading-6';
      description.textContent = toDisplayText(value);

      wrapper.append(term, description);
      return wrapper;
    }

    function createInvoiceCard(invoice, index) {
      const level = normalizeRiskLevel(
        invoice?.risk_level ?? invoice?.extracted_fields?.risk_level
      );
      const theme = RISK_THEMES[level];
      const warnings = normalizeWarnings(
        invoice?.warnings ?? invoice?.warning ?? invoice?.issues ?? invoice?.extracted_fields?.warnings
      );
      const suggestion = toDisplayText(
        invoice?.suggestion ??
          invoice?.advice ??
          invoice?.recommendation ??
          invoice?.建议 ??
          invoice?.extracted_fields?.suggestion
      );
      const invoiceTitle = pickField(invoice, FIELD_KEYS.title);

      const card = document.createElement('article');
      card.className = `rounded-2xl border border-l-4 p-5 shadow-sm sm:p-6 ${theme.card}`;

      const header = document.createElement('div');
      header.className = 'flex items-start justify-between gap-4';

      const headingGroup = document.createElement('div');
      headingGroup.className = 'min-w-0';

      const eyebrow = document.createElement('p');
      eyebrow.className = `text-[11px] font-semibold uppercase tracking-[0.14em] ${theme.eyebrow}`;
      eyebrow.textContent = `Invoice ${String(index + 1).padStart(2, '0')}`;

      const title = document.createElement('h3');
      title.className = `mt-1 break-words text-base font-semibold leading-6 ${theme.title}`;
      title.textContent = invoiceTitle === '—' ? '未命名发票' : toDisplayText(invoiceTitle);

      headingGroup.append(eyebrow, title);

      const badge = document.createElement('span');
      badge.className = `inline-flex shrink-0 items-center rounded-full px-2.5 py-1 text-xs font-semibold ring-1 ring-inset ${theme.badge}`;
      badge.textContent = `${theme.icon} ${theme.name}`;

      header.append(headingGroup, badge);

      const fields = document.createElement('dl');
      fields.className = 'mt-5 grid grid-cols-1 gap-x-6 gap-y-4 sm:grid-cols-2';

      const titleField = createField('抬头', pickField(invoice, FIELD_KEYS.title), 'sm:col-span-2');
      const numberField = createField('号码', pickField(invoice, FIELD_KEYS.number));
      const amountField = createField('金额', pickField(invoice, FIELD_KEYS.amount));
      const detailsField = createField('明细', pickField(invoice, FIELD_KEYS.details), 'sm:col-span-2');
      titleField.querySelector('dt').className += ` ${theme.label}`;
      numberField.querySelector('dt').className += ` ${theme.label}`;
      amountField.querySelector('dt').className += ` ${theme.label}`;
      detailsField.querySelector('dt').className += ` ${theme.label}`;
      titleField.querySelector('dd').className += ` font-medium ${theme.value}`;
      numberField.querySelector('dd').className += ` font-mono ${theme.value}`;
      amountField.querySelector('dd').className += ` font-semibold tabular-nums ${theme.value}`;
      detailsField.querySelector('dd').className += ` ${theme.value}`;

      fields.append(titleField, numberField, amountField, detailsField);

      const riskBlock = document.createElement('div');
      riskBlock.className = `mt-5 border-t pt-4 ${theme.divider}`;

      const riskHeading = document.createElement('p');
      riskHeading.className = `text-[11px] font-semibold uppercase tracking-[0.14em] ${theme.label}`;
      riskHeading.textContent = '风险提示';

      const warningList = document.createElement('ul');
      warningList.className = `mt-2.5 space-y-2 text-sm leading-6 ${theme.warning}`;

      if (warnings.length === 0) {
        const emptyWarning = document.createElement('li');
        emptyWarning.className = 'flex gap-2';
        emptyWarning.textContent = '未发现明显合规风险。';
        warningList.append(emptyWarning);
      } else {
        warnings.forEach((warning) => {
          const item = document.createElement('li');
          item.className = 'flex gap-2';
          const dot = document.createElement('span');
          dot.className = 'mt-2.5 h-1 w-1 shrink-0 rounded-full bg-current opacity-60';
          const text = document.createElement('span');
          text.className = 'min-w-0 break-words';
          text.textContent = warning;
          item.append(dot, text);
          warningList.append(item);
        });
      }

      const suggestionBox = document.createElement('div');
      suggestionBox.className = `mt-4 rounded-xl px-3.5 py-3 ring-1 ring-inset ${theme.suggestion}`;

      const suggestionText = document.createElement('p');
      suggestionText.className = 'break-words text-sm font-bold leading-6';
      suggestionText.textContent = `建议：${suggestion === '—' ? '请核对原始发票信息后再提交报销。' : suggestion}`;

      suggestionBox.append(suggestionText);
      riskBlock.append(riskHeading, warningList, suggestionBox);
      card.append(header, fields, riskBlock);

      return card;
    }

    function setLoading(isLoading) {
      submitButton.disabled = isLoading;
      submitButton.setAttribute('aria-busy', String(isLoading));
      buttonLabel.textContent = isLoading ? 'AI 正在审核中...' : '开始合规预检';
      buttonSpinner.classList.toggle('hidden', !isLoading);
      buttonIcon.classList.toggle('hidden', isLoading);
    }

    function prepareResults() {
      resultsSection.classList.remove('hidden');
      loadingState.classList.add('hidden');
      errorState.classList.add('hidden');
      resultCount.textContent = '';
    }

    function showError(message) {
      resultsSection.classList.remove('hidden');
      loadingState.classList.add('hidden');
      resultsList.replaceChildren();
      errorState.classList.remove('hidden');
      errorMessage.textContent = message;
      resultCount.textContent = '';
      resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function showEmptyState() {
      loadingState.classList.add('hidden');
      errorState.classList.add('hidden');
      resultsList.replaceChildren();

      const empty = document.createElement('div');
      empty.className = 'rounded-2xl border border-slate-200 bg-white p-8 text-center';

      const icon = document.createElement('div');
      icon.className = 'mx-auto flex h-10 w-10 items-center justify-center rounded-full bg-slate-100 text-slate-400';
      icon.innerHTML = '<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>';

      const title = document.createElement('p');
      title.className = 'mt-3 text-sm font-medium text-slate-700';
      title.textContent = '未识别到发票信息';

      const description = document.createElement('p');
      description.className = 'mt-1 text-xs leading-5 text-slate-400';
      description.textContent = '请检查粘贴内容是否完整，然后重新发起预检。';

      empty.append(icon, title, description);
      resultsList.append(empty);
      resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function renderResults(invoices) {
      prepareResults();
      resultsList.replaceChildren();

      if (invoices.length === 0) {
        showEmptyState();
        return;
      }

      resultCount.textContent = `共 ${invoices.length} 张发票`;

      const fragment = document.createDocumentFragment();
      invoices.forEach((invoice, index) => {
        fragment.append(createInvoiceCard(invoice, index));
      });
      resultsList.append(fragment);
      resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function unwrapInvoiceData(value) {
      let current = value;
      const objectKeys = ['result', 'invoices', 'results', 'list', 'data'];

      for (let depth = 0; depth < 5; depth += 1) {
        if (typeof current === 'string') {
          const cleaned = current.trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
          try {
            current = JSON.parse(cleaned);
          } catch (parseError) {
            throw new Error('AI 返回的 data 字段不是有效的 JSON。');
          }
          continue;
        }

        if (current && !Array.isArray(current) && typeof current === 'object') {
          const nextKey = objectKeys.find(
            (key) => Object.prototype.hasOwnProperty.call(current, key) && current[key] !== undefined
          );
          if (!nextKey) break;
          current = current[nextKey];
          continue;
        }

        break;
      }

      if (!Array.isArray(current)) {
        throw new Error('AI 返回的数据结构异常，未找到发票数组。');
      }

      return current;
    }

    class ProxyUnavailableError extends Error {}

    async function requestWorkflow(endpoint, requestBody) {
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${ACCESS_TOKEN}`,
          'Content-Type': 'application/json',
        },
        body: requestBody,
      });

      const rawText = await response.text();
      let payload;

      try {
        payload = JSON.parse(rawText);
      } catch (parseError) {
        throw new Error(`服务返回了无法解析的内容（HTTP ${response.status}）。`);
      }

      if (payload?.success === false && payload?.error === 'keyless_legacy_url') {
        throw new ProxyUnavailableError('corsproxy.io 已停止支持无 API Key 的公共代理地址。');
      }

      if (!response.ok) {
        const apiMessage = payload?.msg || payload?.message || payload?.error;
        throw new Error(apiMessage || `请求失败（HTTP ${response.status}），请稍后重试。`);
      }

      if (payload?.success === false) {
        throw new Error(payload?.message || payload?.error || '代理服务请求失败，请稍后重试。');
      }

      if (payload?.code !== undefined && String(payload.code) !== '0') {
        throw new Error(payload?.msg || payload?.message || `工作流执行失败（错误码 ${payload.code}）。`);
      }

      return payload;
    }

    async function runPreCheck() {
      const text = invoiceText.value.trim();

      if (!text) {
        showError('请先粘贴需要预检的发票文本。');
        invoiceText.focus();
        return;
      }

      resultsSection.classList.remove('hidden');
      loadingState.classList.remove('hidden');
      resultsList.replaceChildren();
      errorState.classList.add('hidden');
      resultCount.textContent = '';
      setLoading(true);

      try {
        const requestBody = JSON.stringify({
          workflow_id: WORKFLOW_ID,
          parameters: {
            invoice_text: text,
          },
        });

        let payload;

        try {
          payload = await requestWorkflow(API_ENDPOINT, requestBody);
        } catch (proxyError) {
          // corsproxy.io 的旧版免 Key 地址已失效；Coze 官方接口已开放 CORS，可安全回退。
          if (!(proxyError instanceof ProxyUnavailableError) && !(proxyError instanceof TypeError)) {
            throw proxyError;
          }
          payload = await requestWorkflow(DIRECT_API_ENDPOINT, requestBody);
        }

        const invoices = unwrapInvoiceData(payload?.data);
        renderResults(invoices);
      } catch (error) {
        const message =
          error instanceof TypeError
            ? '网络请求失败，可能是代理服务不可用或网络连接中断，请稍后重试。'
            : error?.message || '预检过程中发生未知错误，请稍后重试。';
        showError(message);
      } finally {
        setLoading(false);
      }
    }

    submitButton.addEventListener('click', runPreCheck);

    invoiceText.addEventListener('keydown', (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
        event.preventDefault();
        if (!submitButton.disabled) runPreCheck();
      }
    });
  </script>


</body></html>
